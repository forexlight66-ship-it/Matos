name: Fix Sonic ref syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ref declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hooks/useDeriv.ts')
          s=p.read_text()
          bad='originalSorosEnabledRef=useRef(true); sonicManagerRef=useRef<ReturnType<typeof createSonicStakeManager>|null>(null),sonicLastProcessedContractRef=useRef<number|null>(null);'
          good='originalSorosEnabledRef=useRef(true),sonicManagerRef=useRef<ReturnType<typeof createSonicStakeManager>|null>(null),sonicLastProcessedContractRef=useRef<number|null>(null);'
          if bad not in s: raise SystemExit('expected ref declaration not found')
          p.write_text(s.replace(bad,good,1))
          PY
          grep -q 'originalSorosEnabledRef=useRef(true),sonicManagerRef=' hooks/useDeriv.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hooks/useDeriv.ts
          git commit -m 'Fix Sonic ref declaration syntax'
          git push
