name: Apply IA Power dynamic configuration
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update AutoBot IA Power defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          s=s.replace("import { criarGestorStake } from '@/lib/gestorStake';", "import { criarGestorStake } from '@/lib/gestorStakeSorosMartingaleDinamico';")
          s=s.replace('const IA_MAX_MARTINGALE=1;', 'const IA_MAX_MARTINGALE=7;')
          s=s.replace('[target,setTarget]=useState(180)', '[target,setTarget]=useState(1500)')
          s=s.replace('[lossLimit,setLossLimit]=useState(2500)', '[lossLimit,setLossLimit]=useState(4000)')
          s=s.replace('[metas,setMetas]=useState(false),[maxMartingale,setMaxMartingale]=useState(1)', '[metas,setMetas]=useState(false),[maxMartingale,setMaxMartingale]=useState(7)')
          s=s.replace('[currency,setCurrency]=useState<\'USD\'|\'MZN\'>(\'MZN\'),[iaPower,setIaPower]=useState(false)', '[currency,setCurrency]=useState<\'USD\'|\'MZN\'>(\'MZN\'),[iaPower,setIaPower]=useState(true)')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx
          git diff --cached --quiet || git commit -m 'Enable IA Power with dynamic Soros Martingale defaults'
          git push
          git rm .github/workflows/apply-ai-power-dynamic.yml
          git commit -m 'Remove temporary IA Power update workflow'
          git push
