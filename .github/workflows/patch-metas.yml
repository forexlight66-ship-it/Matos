name: Patch Matos settings
on:
  push:
    branches: [fix/metas-martingale-menu]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          s=s.replace("[metas,setMetas]=useState(false),[theme,setTheme]", "[metas,setMetas]=useState(false),[maxMartingale,setMaxMartingale]=useState(7),[theme,setTheme]")
          s=s.replace("[target,setTarget]=useState(180),[lossLimit,setLossLimit]=useState(35000)", "[target,setTarget]=useState(2500),[lossLimit,setLossLimit]=useState(4000)")
          s=s.replace("maxNiveisMartingale:IA_MAX_MARTINGALE", "maxNiveisMartingale:maxMartingale")
          s=s.replace("},[stake,running]);", "},[stake,maxMartingale,running]);")
          s=s.replace("gestorRef.current=criarGestorStake({stakeBase:stake,payout:IA_PAYOUT,maxNiveisMartingale:maxMartingale});setStakeManagerVersion", "gestorRef.current=criarGestorStake({stakeBase:stake,payout:IA_PAYOUT,maxNiveisMartingale:maxMartingale});setStakeManagerVersion")
          marker=" useEffect(()=>{try{localStorage.setItem('mozhyper-currency',currency)}catch{}},[currency]);"
          add=" useEffect(()=>{if(!menu)return;const onPointerDown=(e:PointerEvent)=>{const el=e.target as HTMLElement;if(!el.closest('.menu-trigger')&&!el.closest('.menu-popover'))setMenu(false)};document.addEventListener('pointerdown',onPointerDown);return()=>document.removeEventListener('pointerdown',onPointerDown)},[menu]);"
          if add not in s:
              s=s.replace(marker, marker+add)
          s=s.replace("<div className=\"absolute right-0 z-50 mt-12 w-48", "<div className=\"menu-popover absolute right-0 z-50 mt-12 w-48")
          old="<label className=\"mt-3 block text-xs\">{t('lossGoal')} (MT)<input className=\"mt-2 w-full rounded-lg border border-slate-600 bg-transparent p-2\" type=\"number\" value={lossLimit} onChange={e=>setLossLimit(Number(e.target.value))}/></label><button"
          new="<label className=\"mt-3 block text-xs\">{t('lossGoal')} (MT)<input className=\"mt-2 w-full rounded-lg border border-slate-600 bg-transparent p-2\" type=\"number\" value={lossLimit} onChange={e=>setLossLimit(Math.max(0,Number(e.target.value)))}/></label><label className=\"mt-3 block text-xs\">Máx. Martingale<input className=\"mt-2 w-full rounded-lg border border-slate-600 bg-transparent p-2\" type=\"number\" min=\"1\" max=\"20\" step=\"1\" value={maxMartingale} onChange={e=>setMaxMartingale(Math.min(20,Math.max(1,Math.floor(Number(e.target.value)||1))))}/><div className=\"mt-1 text-[9px] muted\">Níveis máximos após perdas consecutivas.</div></label><button"
          if old not in s: raise SystemExit('metas marker not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx
          git commit -m 'Update metas and configurable Martingale [skip ci]'
          git push
      - name: Cleanup workflow
        run: |
          git rm .github/workflows/patch-metas.yml
          git commit -m 'Remove temporary patch workflow [skip ci]'
          git push
