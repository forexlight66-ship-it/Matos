name: One-time Sonic execution synchronization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sonic execution layer
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('hooks/useDeriv.ts')
          s = p.read_text()
          imp = "import { DerivWebSocket } from '@/lib/websocket';"
          if 'createSonicStakeManager' not in s:
              s = s.replace(imp, imp + "\nimport { createSonicStakeManager } from '@/lib/sonicStakeManager';")
          old_refs = "originalSorosEnabledRef=useRef(true);"
          new_refs = old_refs + " sonicManagerRef=useRef<ReturnType<typeof createSonicStakeManager>|null>(null),sonicLastProcessedContractRef=useRef<number|null>(null);"
          if 'sonicManagerRef=' not in s:
              s = s.replace(old_refs, new_refs)
          marker = " const getProposal=useCallback((symbol:string,contractType:string,amount:number,duration:number,barrier=0,useOriginalSoros=true)=>"
          helper = """ const getSonicStake=useCallback((fallback:number)=>{\n  const base=Math.max(0.35,Number(fallback)||0.35);\n  if(!sonicManagerRef.current)sonicManagerRef.current=createSonicStakeManager({baseStake:base,maxLevel:8});\n  return sonicManagerRef.current.getStake();\n },[]);\n const processSonicExecutionResult=useCallback((tx:ProfitTransaction)=>{\n  if(originalSorosEnabledRef.current||!sonicManagerRef.current)return;\n  const id=Number(tx.contract_id);\n  if(!Number.isFinite(id)||id<=0||sonicLastProcessedContractRef.current===id)return;\n  sonicLastProcessedContractRef.current=id;\n  sonicManagerRef.current.recordResult(calculateProfitLoss(tx));\n },[]);\n"""
          if 'processSonicExecutionResult' not in s:
              s = s.replace(marker, helper + marker)
          old_eff = "const effectiveAmount=useOriginalSoros&&originalSorosEnabledRef.current\n    ?Math.max(SOROS_MIN,Number(s.level>0?s.stake:s.initialStake))\n    :fallback;"
          new_eff = "const effectiveAmount=!originalSorosEnabledRef.current\n    ?getSonicStake(fallback)\n    :(useOriginalSoros?Math.max(SOROS_MIN,Number(s.level>0?s.stake:s.initialStake)):fallback);"
          if old_eff in s:
              s = s.replace(old_eff, new_eff)
          old_close = "sessionContractIdsRef.current.add(contractId);processSorosResult(closedTx);mergeProfitTransactions([closedTx]);"
          new_close = "sessionContractIdsRef.current.add(contractId);processSonicExecutionResult(closedTx);processSorosResult(closedTx);mergeProfitTransactions([closedTx]);"
          if old_close in s and 'processSonicExecutionResult(closedTx)' not in s:
              s = s.replace(old_close, new_close)
          old_deps = "[accountType,refreshProfitTable,mergeProfitTransactions,processSorosResult,restoreTradingCache]"
          new_deps = "[accountType,refreshProfitTable,mergeProfitTransactions,processSorosResult,processSonicExecutionResult,restoreTradingCache]"
          s = s.replace(old_deps, new_deps)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q "createSonicStakeManager" hooks/useDeriv.ts
          grep -q "processSonicExecutionResult" hooks/useDeriv.ts
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hooks/useDeriv.ts
          git rm .github/workflows/patch-sonic-execution.yml
          git commit -m "Fix Sonic stake transitions in execution layer"
          git push
