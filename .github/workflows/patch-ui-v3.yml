name: Patch AutoBotV4 UI v3
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          if 'lastDigitSeen' in s:
              raise SystemExit('already patched')
          s=s.replace("const [iaPower,setIaPower]=useState(true),[sonic,setSonic]=useState(false);", "const [iaPower,setIaPower]=useState(true),[sonic,setSonic]=useState(false);\n const [lastDigitSeen,setLastDigitSeen]=useState<number|null>(null),[contractStage,setContractStage]=useState<0|1|2>(0);", 1)
          s=s.replace("const pipSize=Number((tick as any).pip_size)>0?Number((tick as any).pip_size):tickPipSize;setTicks(prev=>{", "const pipSize=Number((tick as any).pip_size)>0?Number((tick as any).pip_size):tickPipSize;setLastDigitSeen(digit(q,pipSize));setTicks(prev=>{", 1)
          n=" useEffect(()=>{if(!notice)return;const timer=setTimeout(()=>setNotice(null),4000);return()=>clearTimeout(timer)},[notice]);"
          s=s.replace(n, " useEffect(()=>{if(activeContractId!==null)setContractStage(1);else if(contractClosedSeq===0)setContractStage(0)},[activeContractId,contractClosedSeq]);\n useEffect(()=>{if(contractClosedSeq>0){setContractStage(2);const timer=setTimeout(()=>setContractStage(activeContractId!==null?1:0),3000);return()=>clearTimeout(timer)}},[contractClosedSeq,activeContractId]);\n"+n, 1)
          start=s.index('<div className="card mt-3 p-4"><div className="flex items-center justify-between"><b className="text-[10px] uppercase">{t(\'status\')}</b>')
          end=s.index('<div className="card mt-3 p-4" style={{borderColor:\'#facc15\'}}><div className="flex justify-between"><b className="text-[10px] uppercase muted">{t(\'recentHistory\')}</b>', start)
          block='''<div className="card mt-3 p-4">
  <div className="flex items-center justify-between">
    <b className="text-[13px] font-bold">Últimos Dígitos: {lastDigitSeen ?? '—'}</b>
    <select className="rounded-lg bg-transparent px-2 py-1 text-xs font-bold" value={tickWindow} onChange={e=>setTickWindow(Number(e.target.value))} disabled={running}>{[5,10,25,50,100,200].map(n=><option key={n} value={n}>{n} ticks</option>)}</select>
  </div>
  <div className="mt-4 grid grid-cols-10 items-end gap-1">{st.probs.map((p,i)=>{const maxP=Math.max(...st.probs),minP=Math.min(...st.probs);const isMax=p===maxP&&p>0,isMin=p===minP;const barColor=isMax?'bg-emerald-500':isMin?'bg-red-500':'bg-slate-300';return <div key={i} className="text-center"><div className={`text-[10px] font-bold ${isMax?'text-emerald-500':''}`}>{p.toFixed(0)}%</div><div className={`mx-auto rounded-sm mt-1 ${barColor}`} style={{height:`${Math.max(7,Math.min(64,p*1.8))}px`,width:'20px'}}/><div className="text-[10px] font-bold mt-1">{i}</div></div>})}</div>
</div>
<div className="card mt-3 p-3 flex items-center gap-3">
  <button className="flex-shrink-0 h-11 w-11 rounded-lg bg-red-600 flex items-center justify-center" onClick={stop} disabled={!running} aria-label="Parar robô"><span className="block h-3.5 w-3.5 bg-white rounded-sm" /></button>
  <div className="flex-1"><div className="flex items-center">{['Analisando','Aberto','Fechado'].map((label,i)=><div key={label} className="flex items-center" style={{flex:i<2?1:'0 0 auto'}}><div className="h-[9px] w-[9px] rounded-full" style={{background:i<=contractStage?'#5b6cf5':'#1b1d1d',border:i<=contractStage?'none':'2px solid #323738'}}/>{i<2&&<div className="flex-1 h-[2px] mx-1" style={{background:i<contractStage?'#5b6cf5':'#323738'}}/>}</div>)}</div><div className="flex justify-between mt-1.5" style={{whiteSpace:'nowrap'}}>{['Analisando','Aberto','Fechado'].map((label,i)=><span key={label} className="text-[10px] font-bold uppercase" style={{color:i<=contractStage?'#fff':'#6e6e6e'}}>{label}</span>)}</div></div>
</div>
<div className="mt-2 flex items-center justify-between px-1"><div className="flex items-center gap-1.5 text-xs font-semibold" style={{color:'#c2c2c2'}}><span className="h-1.5 w-1.5 rounded-full" style={{background:running?'#4bb4b3':'#6e6e6e'}}/>{running?t('running'):t('stopped')}</div><span className="font-mono text-sm">{tick?.quote??'—'}</span></div>
'''
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx
          git commit -m 'Update AutoBotV4 digit status and contract stage UI'
          git rm .github/workflows/patch-ui-update.yml .github/workflows/patch-ui-v2.yml .github/workflows/patch-ui-v3.yml
          git commit -m 'Remove temporary UI patch workflows'
          git push
