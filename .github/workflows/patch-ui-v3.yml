name: Fix Sonic useDeriv order
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Sonic callback before main effect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hooks/useDeriv.ts')
          s=p.read_text()
          block=""" const processSonicExecutionResult=useCallback((tx:ProfitTransaction)=>{
  if(originalSorosEnabledRef.current||!sonicManagerRef.current)return;
  const id=Number(tx.contract_id);
  if(!Number.isFinite(id)||id<=0||sonicLastProcessedContractRef.current===id)return;
  sonicLastProcessedContractRef.current=id;
  sonicManagerRef.current.recordResult(calculateProfitLoss(tx));
 },[]);
"""
          if s.count('const processSonicExecutionResult=useCallback') != 1:
              raise SystemExit('Expected exactly one Sonic callback')
          s=s.replace(block,'',1)
          anchor=' const resetTradingSession=useCallback'
          a=s.find(anchor)
          if a<0: raise SystemExit('resetTradingSession not found')
          e=s.find('\n useEffect(()=>',a)
          if e<0: raise SystemExit('main effect not found')
          s=s[:e]+'\n'+block.rstrip()+'\n'+s[e:]
          p.write_text(s)
          PY
      - name: Verify source order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hooks/useDeriv.ts').read_text()
          r=s.index('const resetTradingSession=useCallback')
          p=s.index('const processSonicExecutionResult=useCallback')
          e=s.index('useEffect(()=>{let cancelled=false',p)
          assert r<p<e
          print('Sonic callback order OK')
          PY
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hooks/useDeriv.ts
          git commit -m 'Fix Sonic execution callback declaration order'
          git rm .github/workflows/fix-sonic-order.yml .github/workflows/patch-ui-update.yml .github/workflows/patch-ui-v2.yml .github/workflows/patch-ui-v3.yml
          git commit -m 'Remove temporary patch workflows'
          git push
