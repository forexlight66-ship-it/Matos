name: Update metas defaults
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update requested defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          replacements={
            'const IA_MAX_MARTINGALE=6;':'const IA_MAX_MARTINGALE=3;',
            '[metas,setMetas]=useState(false),[maxMartingale,setMaxMartingale]=useState(6)':'[metas,setMetas]=useState(false),[maxMartingale,setMaxMartingale]=useState(3)',
            '[target,setTarget]=useState(1500)':'[target,setTarget]=useState(180)',
            '[lossLimit,setLossLimit]=useState(4000)':'[lossLimit,setLossLimit]=useState(2500)',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          q=Path('lib/gestorStake.ts')
          s=q.read_text().replace('Number(config.maxNiveisMartingale) || 6','Number(config.maxNiveisMartingale) || 3')
          q.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx lib/gestorStake.ts
          git diff --cached --quiet || git commit -m 'Set metas defaults to 180 MT, 2500 MT loss and Martingale 3'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-metas-defaults.yml
          git commit -m 'Remove temporary metas update workflow'
          git push
