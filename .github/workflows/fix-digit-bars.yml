name: Fix digit bars layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix fixed-height digit chart
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/AutoBotV4.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''<div className="mt-3 grid grid-cols-10 items-end gap-1">{(()=>{const maxP=Math.max(...st.probs),minP=Math.min(...st.probs);return st.probs.map((p,i)=>{const isMax=p===maxP&&p>0,isMin=p===minP;const barColor=isMax?'bg-emerald-500':isMin?'bg-red-500':'bg-slate-300';return <div key={i} className="text-center"><div className={`mx-auto rounded-sm ${barColor}`} style={{height:`${Math.max(7,Math.min(70,p*1.8))}px`,width:'18px'}}/><div className="text-[8px] muted">{i}</div><div className="text-[8px] font-bold muted">{p.toFixed(0)}%</div></div>})})()}</div>'''
          new = '''<div className="mt-3 grid h-[88px] grid-cols-10 items-end gap-1">{(()=>{const maxP=Math.max(...st.probs),minP=Math.min(...st.probs);return st.probs.map((p,i)=>{const isMax=p===maxP&&p>0,isMin=p===minP;const barColor=isMax?'bg-emerald-500':isMin?'bg-red-500':'bg-slate-300';return <div key={i} className="flex h-full flex-col items-center justify-end text-center"><div className={`mx-auto rounded-sm ${barColor}`} style={{height:`${Math.max(7,Math.min(70,p*1.8))}px`,width:'18px'}}/><div className="text-[8px] muted">{i}</div><div className="text-[8px] font-bold muted">{p.toFixed(0)}%</div></div>})})()}</div>'''
          if old not in s:
              raise SystemExit('Target digit chart markup not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AutoBotV4.tsx
          git commit -m "Fix fixed-height digit bars layout" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-digit-bars.yml
          git commit -m "Remove temporary digit bar workflow"
          git push
