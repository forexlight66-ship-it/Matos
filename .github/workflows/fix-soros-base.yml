name: Fix Soros base synchronization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Original Soros base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hooks/useDeriv.ts')
          s=p.read_text()
          old="const setSorosStake=useCallback((initialStake:number)=>{if(!originalSorosEnabledRef.current)return;const value=Math.max(SOROS_MIN,Number(initialStake)||SOROS_MIN);const s=sorosRef.current;if(s.level===0)syncSoros({...s,stake:value,initialStake:value,enabled:true,blocked:false})},[syncSoros]);"
          new="const setSorosStake=useCallback((initialStake:number)=>{if(!originalSorosEnabledRef.current)return;const value=Math.max(SOROS_MIN,Number(initialStake)||SOROS_MIN);syncSoros(defaultSoros(value))},[syncSoros]);"
          if old not in s: raise SystemExit('setSorosStake block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: grep -q "syncSoros(defaultSoros(value))" hooks/useDeriv.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hooks/useDeriv.ts
          git commit -m "Force Original Soros to sync manual base stake"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-soros-base.yml || true
          git commit -m "Remove temporary Soros base workflow [skip ci]" || true
          git push || true
