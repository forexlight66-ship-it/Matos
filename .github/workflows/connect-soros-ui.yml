name: Connect Soros UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AutoBotV2 Soros interface
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('components/AutoBotV2.tsx')
          s = p.read_text()
          marker = 'Soros UI connected v1'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)

          old = "  const { tick, balance, proposal, buy, buying, activeContractId, getProposal, subscribeTicks, isAuthorized, isConnected, error, profitTransactions, contractClosedSeq } = useDeriv(accountType);"
          new = "  const { tick, balance, proposal, buy, buying, activeContractId, getProposal, subscribeTicks, isAuthorized, isConnected, error, profitTransactions, contractClosedSeq, soros, resetSoros, setSorosEnabled } = useDeriv(accountType);"
          if old not in s:
              raise SystemExit('Deriv destructuring anchor not found')
          s = s.replace(old, new, 1)

          old = "  const progress = dailyTarget > 0 ? Math.max(0, Math.min(100, sessionProfit * MT_PER_USD / dailyTarget * 100)) : 0;"
          new = old + "\n  // Soros UI connected v1: the hook is the single source of truth for stake progression.\n  const sorosEntry = soros.enabled ? soros.stake : stake;\n  const sorosStepLabel = soros.level + 1;"
          if old not in s:
              raise SystemExit('Progress anchor not found')
          s = s.replace(old, new, 1)

          old = "      <div className=\"grid grid-cols-2 overflow-hidden rounded-xl border border-slate-700 bg-slate-900\">"
          card = '''      {/* Soros UI connected v1 */}\n      <div className=\"rounded-xl border border-emerald-800 bg-slate-900 p-4\">\n        <div className=\"flex items-center justify-between gap-3\">\n          <div>\n            <div className=\"text-xs font-bold\">Soros · 3 passos</div>\n            <div className=\"mt-1 text-[10px] text-slate-400\">Passo {sorosStepLabel}/3 · Entrada atual US$ {sorosEntry.toFixed(2)}</div>\n          </div>\n          <button\n            className={`rounded-lg border px-3 py-2 text-[10px] font-bold ${soros.enabled ? 'border-emerald-600 text-emerald-400' : 'border-slate-600 text-slate-400'}`}\n            onClick={() => { setSorosEnabled(!soros.enabled); if (!soros.enabled) resetSoros(); }}\n            disabled={running}\n          >{soros.enabled ? 'ATIVO' : 'DESLIGADO'}</button>\n        </div>\n        <div className=\"mt-3 grid grid-cols-3 gap-2 text-center text-[9px] text-slate-400\">\n          <div className=\"rounded-lg bg-slate-950 p-2\"><div className=\"text-slate-500\">Entrada</div><b className=\"text-slate-200\">US$ {sorosEntry.toFixed(2)}</b></div>\n          <div className=\"rounded-lg bg-slate-950 p-2\"><div className=\"text-slate-500\">Lucro acumulado</div><b className=\"text-emerald-400\">US$ {soros.accumulatedProfit.toFixed(2)}</b></div>\n          <div className=\"rounded-lg bg-slate-950 p-2\"><div className=\"text-slate-500\">Estado</div><b className={soros.blocked ? 'text-red-400' : 'text-slate-200'}>{soros.blocked ? 'PARADO' : 'PRONTO'}</b></div>\n        </div>\n        {soros.blocked && <div className=\"mt-2 rounded-lg border border-red-900 bg-red-950/30 p-2 text-[9px] text-red-300\">Perda no Passo 1: o Soros está parado. Desative e ative novamente para iniciar novo ciclo.</div>}\n      </div>\n\n''' + old
          if old not in s:
              raise SystemExit('Balance anchor not found')
          s = s.replace(old, card, 1)

          p.write_text(s)
          PY

      - name: Validate
        run: |
          npm install
          npm run build

      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AutoBotV2.tsx
          git rm .github/workflows/connect-soros-ui.yml
          git commit -m "feat: connect AutoBotV2 to shared Soros state"
          git push
