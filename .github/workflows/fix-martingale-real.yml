name: Fix Martingale real payout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Corrige martingale: usa payout real do contrato em vez de 0.95 fixo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Martingale
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('lib/gestorStakeSorosMartingaleDinamico.ts')
          s=p.read_text()
          old="""  const stakeParaRecuperar = (deficit: number) =>
    arredondar((Math.max(0, deficit) + stakeBase) / payout);
"""
          new="""  const stakeParaRecuperar = (deficit: number) => {
    const objetivo = Math.max(0, deficit) + stakeBase;
    const stake = objetivo / Math.max(0.0001, payout);
    // Arredonda sempre para cima aos centavos para que o payout real
    // cubra o défice e preserve o lucro-alvo, evitando sub-recuperação.
    return Math.ceil(stake * 100 - 1e-9) / 100;
  };
"""
          if old not in s: raise SystemExit('Formula stakeParaRecuperar não encontrada')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          marker=" const gestorRef=useRef(criarGestorStake({stakeBase:IA_RISK_STAKE,payout:IA_PAYOUT,maxNiveisMartingale:maxMartingale}));"
          if 'const lastPayoutRatioRef=useRef(IA_PAYOUT);' not in s:
              if marker not in s: raise SystemExit('gestorRef não encontrado')
              s=s.replace(marker, marker+"\n const lastPayoutRatioRef=useRef(IA_PAYOUT);",1)

          deriv=" const{tick,balance,proposal,buy,buying,activeContractId,getProposal,subscribeTicks,isAuthorized,isConnected,error,profitTransactions,soros,setSorosStake,setSorosEnabled,contractClosedSeq,fetchProfitTable,resetTradingSession}=useDeriv(account);"
          if 'lastPayoutRatioRef.current=ratio' not in s:
              if deriv not in s: raise SystemExit('useDeriv não encontrado')
              effect=""" useEffect(()=>{
  if(!proposal||!proposal.ask_price)return;
  const ratio=(proposal.payout-proposal.ask_price)/proposal.ask_price;
  if(Number.isFinite(ratio)&&ratio>0)lastPayoutRatioRef.current=ratio;
 },[proposal]);"""
              s=s.replace(deriv,deriv+effect,1)

          if 'gestorRef.current.atualizarPayout(lastPayoutRatioRef.current);' not in s:
              registrar='gestorRef.current.registrarResultado(Number(latest.profit_loss||0));'
              if registrar not in s: raise SystemExit('registrarResultado não encontrado')
              s=s.replace(registrar,'gestorRef.current.atualizarPayout(lastPayoutRatioRef.current);\n'+registrar,1)

          p.write_text(s)

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit final
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/gestorStakeSorosMartingaleDinamico.ts components/AutoBotV4.tsx
          git rm -f .github/workflows/fix-martingale-real.yml
          git commit -m 'Corrige martingale: usa payout real do contrato em vez de 0.95 fixo'
          git push origin main
