name: Fix logout persistence reset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: clear persistence history on logout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch logout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          old="const logout=()=>{stop();resetTradingSession();setMenu(false);window.location.assign('/api/auth/logout')};"
          new="const logout=()=>{stop();try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k?.startsWith('mozhyper-stake-state-v2:'))localStorage.removeItem(k)}}catch{}resetTradingSession();setMenu(false);window.location.assign('/api/auth/logout')};"
          if old not in s:
              raise SystemExit('logout pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx
          git commit -m 'fix: clear persistence history on logout'
          git push
      - name: Cleanup workflow
        run: |
          rm -f .github/workflows/fix-logout-persistence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-logout-persistence.yml
          git commit -m 'chore: remove temporary logout patch workflow'
          git push
