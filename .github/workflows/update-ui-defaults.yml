name: Update UI and defaults
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/LoginPage.tsx')
          s=p.read_text()
          s=s.replace("border: '1px solid rgba(255,255,255,.10)'", "border: '1px solid #facc15'")
          s=s.replace("background: 'rgba(255,255,255,.07)', margin: '23px 0 18px'", "background: '#facc15', margin: '23px 0 18px'")
          p.write_text(s)

          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          s=s.replace('const IA_MAX_MARTINGALE=7;', 'const IA_MAX_MARTINGALE=6;')
          s=s.replace('[metas,setMetas]=useState(false),[maxMartingale,setMaxMartingale]=useState(7)', '[metas,setMetas]=useState(false),[maxMartingale,setMaxMartingale]=useState(6)')
          s=s.replace('[target,setTarget]=useState(2500)', '[target,setTarget]=useState(1500)')
          p.write_text(s)

          p=Path('lib/gestorStake.ts')
          s=p.read_text()
          s=s.replace('Math.floor(Number(config.maxNiveisMartingale) || 7)', 'Math.floor(Number(config.maxNiveisMartingale) || 6)')
          s=s.replace('Math.max(1, requestedMax === 5 ? 7 : requestedMax)', 'Math.max(1, requestedMax)')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/LoginPage.tsx components/AutoBotV4.tsx lib/gestorStake.ts
          git commit -m 'fix: yellow login accents and set profit 1500 martingale 6'
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/update-ui-defaults.yml
          git add .github/workflows/update-ui-defaults.yml
          git commit -m 'chore: remove temporary update workflow'
          git push
