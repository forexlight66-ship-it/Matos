name: Fix history delete button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Apply reliable history reset')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch history reset
        shell: python
        run: |
          from pathlib import Path

          p = Path('components/AutoBotV4.tsx')
          s = p.read_text()

          if "function TrashIcon" not in s:
              marker = "function WhatsAppIcon({ size = 17, color = 'currentColor' }) {"
              icon = """function TrashIcon({ size = 15, color = 'currentColor' }) {\n  return (\n    <svg width={size} height={size} viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n      <path d=\"M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6\" stroke={color} strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\"/>\n    </svg>\n  );\n}\n"""
              if marker not in s:
                  raise SystemExit('WhatsAppIcon marker not found')
              s = s.replace(marker, icon + marker, 1)

          old_button = '''<button type="button" onClick={clearHistoryAndStartNewCycle} disabled={running} className="rounded-lg border border-red-500/70 px-2.5 py-1 text-[9px] font-black uppercase text-red-500 disabled:cursor-not-allowed disabled:opacity-40" title="Limpar histórico e começar novo ciclo">Delete</button>'''
          new_button = '''<button type="button" onClick={clearHistoryAndStartNewCycle} disabled={running} className="flex h-7 w-7 items-center justify-center rounded-lg border border-red-500/70 text-red-500 disabled:cursor-not-allowed disabled:opacity-40" title="Limpar histórico e começar novo ciclo" aria-label="Limpar histórico e começar novo ciclo"><TrashIcon size={14} /></button>'''
          if old_button not in s:
              raise SystemExit('Delete button markup not found')
          s = s.replace(old_button, new_button, 1)

          old_reset = "  resetTradingSession();\n  setNotice('Histórico e prejuízo limpos — novo ciclo iniciado');"
          new_reset = "  resetTradingSession();\n  setNotice('Histórico e prejuízo limpos — novo ciclo iniciado');"
          if old_reset not in s:
              raise SystemExit('clear-history reset block not found')
          s = s.replace(old_reset, new_reset, 1)
          p.write_text(s)

          p = Path('hooks/useDeriv.ts')
          s = p.read_text()
          old = "const resetTradingSession=useCallback(()=>{const now=Math.floor(Date.now()/1000);sessionStartedAtRef.current=now;closedContractsRef.current.clear();sessionContractIdsRef.current.clear();lastProcessedSorosContractRef.current=null;balanceCacheRef.current=null;setBalance(null);setProfitTransactions([]);setProfitCount(0);setContractClosedSeq(0);clearSorosStorage();try{localStorage.removeItem(cacheKey(accountType));sessionStorage.setItem(TRADING_SESSION_STORAGE,String(now))}catch{};const fresh=defaultSoros(sorosRef.current.initialStake||SOROS_MIN);sorosRef.current=fresh;setSoros(fresh)},[accountType]);"
          new = "const resetTradingSession=useCallback(()=>{const now=Math.floor(Date.now()/1000);sessionStartedAtRef.current=now;closedContractsRef.current.clear();sessionContractIdsRef.current.clear();lastProcessedSorosContractRef.current=null;balanceCacheRef.current=null;setBalance(null);setProfitTransactions([]);setProfitCount(0);setContractClosedSeq(0);clearSorosStorage();try{localStorage.removeItem(cacheKey(accountType));sessionStorage.setItem(TRADING_SESSION_STORAGE,String(now))}catch{};const fresh=defaultSoros(sorosRef.current.initialStake||SOROS_MIN);sorosRef.current=fresh;setSoros(fresh);wsRef.current?.subscribeBalance()},[accountType]);"
          if old not in s:
              raise SystemExit('resetTradingSession definition not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Build
        run: npm install && npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AutoBotV4.tsx hooks/useDeriv.ts
          git diff --cached --quiet && exit 0
          git commit -m "Apply reliable history reset"
          git push origin HEAD:main
