name: Remove currency rate display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-currency-rate-display.yml'
      - 'components/AutoBotV4.tsx'

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Remove currency rate display') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove rate text from currency dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/AutoBotV4.tsx')
          s = p.read_text(encoding='utf-8')
          old = "{CURRENCY_LABELS[c]} — 1 USD = {CURRENCY_RATES[c]} {c}"
          new = "{CURRENCY_LABELS[c]}"
          if old not in s:
              raise SystemExit('Target text not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx
          git commit -m 'Remove currency rate display'
          git push
