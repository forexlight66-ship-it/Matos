name: Apply Soros and stake fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hooks/useDeriv.ts'); s=p.read_text()
          s=s.replace('const SOROS_MIN=1.50,','const SOROS_MIN=0.01,')
          s=s.replace('.slice(0,200);localStorage.setItem(cacheKey(accountType)', '.slice(0,600);localStorage.setItem(cacheKey(accountType)')
          p.write_text(s)
          p=Path('components/AutoBotV4.tsx'); s=p.read_text()
          old="lastProcessedStakeResult=useRef<number|string|null>(null),gestorRef=useRef"
          new="lastProcessedStakeResult=useRef<number|string|null>(null),stakeReadyRef=useRef(true),gestorRef=useRef"
          if old not in s: raise SystemExit('ref pattern not found')
          s=s.replace(old,new,1)
          old="if(requested.current||activeContractId!==null)return;requested.current=true;requestStartedAt.current=Date.now();"
          new="if(requested.current||activeContractId!==null)return;if(iaPower&&!stakeReadyRef.current)return;stakeReadyRef.current=false;requested.current=true;requestStartedAt.current=Date.now();"
          if old not in s: raise SystemExit('proposal pattern not found')
          s=s.replace(old,new,1)
          old="if(!getProposal(symbol,TYPES[c],amount,1,barrier,!iaPower)){requested.current=false;requestStartedAt.current=0}"
          new="if(!getProposal(symbol,TYPES[c],amount,1,barrier,!iaPower)){requested.current=false;requestStartedAt.current=0;stakeReadyRef.current=true}"
          if old not in s: raise SystemExit('failure pattern not found')
          s=s.replace(old,new,1)
          old="lastProcessedStakeResult.current=id;gestorRef.current.registrarResultado(Number(latest.profit_loss||0)>=0);setStakeManagerVersion(v=>v+1)"
          new="lastProcessedStakeResult.current=id;gestorRef.current.registrarResultado(Number(latest.profit_loss||0)>=0);stakeReadyRef.current=true;setStakeManagerVersion(v=>v+1)"
          if old not in s: raise SystemExit('result pattern not found')
          s=s.replace(old,new,1)
          old="lastProcessedStakeResult.current=latest?.contract_id??null;stopped.current=false;requested.current=false;"
          new="lastProcessedStakeResult.current=latest?.contract_id??null;stakeReadyRef.current=true;stopped.current=false;requested.current=false;"
          if old not in s: raise SystemExit('start pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'SOROS_MIN=0.01' hooks/useDeriv.ts
          grep -q '.slice(0,600)' hooks/useDeriv.ts
          grep -q 'stakeReadyRef' components/AutoBotV4.tsx
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hooks/useDeriv.ts components/AutoBotV4.tsx
          git diff --cached --quiet || git commit -m 'Fix manual stake, Soros sequencing and 600-trade cache [skip ci]'
          git push
          rm -f .github/workflows/apply-soros-fixes.yml
          git add .github/workflows/apply-soros-fixes.yml
          git commit -m 'Remove temporary fix workflow [skip ci]'
          git push
