name: Set Martingale default to 1
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          s=s.replace('const IA_MAX_MARTINGALE=3;', 'const IA_MAX_MARTINGALE=1;')
          s=s.replace('[maxMartingale,setMaxMartingale]=useState(3)', '[maxMartingale,setMaxMartingale]=useState(1)')
          p.write_text(s)
          q=Path('lib/gestorStake.ts')
          s=q.read_text().replace('Number(config.maxNiveisMartingale) || 3', 'Number(config.maxNiveisMartingale) || 1')
          q.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx lib/gestorStake.ts
          git diff --cached --quiet || git commit -m 'Set default Martingale level to 1'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/set-martingale-default-1.yml
          git commit -m 'Remove temporary Martingale workflow'
          git push
