name: Refine history delete
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/AutoBotV4.tsx')
          s=p.read_text()
          s=s.replace("import { useEffect, useMemo, useRef, useState } from 'react';", "import { useEffect, useMemo, useRef, useState } from 'react';\nimport { Trash2 } from 'lucide-react';")
          s=s.replace('>Delete</button>', '><Trash2 size={14} strokeWidth={2.5} /></button>')
          s=s.replace("resetTradingSession();\n  setNotice", "resetTradingSession();\n  fetchProfitTable({limit:500,offset:0,sort:'DESC'});\n  setNotice")
          s=s.replace('title="Limpar histórico e começar novo ciclo"', 'title="Limpar histórico e começar novo ciclo" aria-label="Limpar histórico e começar novo ciclo"')
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx
          git commit -m 'Use trash icon and refresh balance after cycle reset'
          git rm .github/workflows/patch-delete-icon-balance.yml
          git commit -m 'Remove temporary delete refinement workflow'
          git push
