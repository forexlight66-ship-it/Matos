name: Finalize Martingale real payout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Corrige martingale: usa payout real do contrato em vez de 0.95 fixo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar payout real
        shell: python
        run: |
          from pathlib import Path
          manager=Path('lib/gestorStakeSorosMartingaleDinamico.ts')
          s=manager.read_text()
          if 'function atualizarPayout(novoPayout: number)' not in s:
              old='  const payout = Math.max(0.0001, Number(config.payout) || 0.95);'
              new='''  let payout = Math.max(0.0001, Number(config.payout) || 0.95);\n\n  function atualizarPayout(novoPayout: number): void {\n    if (Number.isFinite(novoPayout) && novoPayout > 0) payout = novoPayout;\n  }'''
              if old not in s: raise SystemExit('Payout fixo não encontrado')
              s=s.replace(old,new,1)
          if 'atualizarPayout,' not in s:
              old='  return { proximoStake, registrarResultado, getEstado, getEstatisticas, resetSessao, restaurarEstado };'
              new='''  return {\n    proximoStake,\n    registrarResultado,\n    getEstado,\n    getEstatisticas,\n    resetSessao,\n    restaurarEstado,\n    atualizarPayout,\n  };'''
              if old not in s: raise SystemExit('Return do gestor não encontrado')
              s=s.replace(old,new,1)
          manager.write_text(s)

          bot=Path('components/AutoBotV4.tsx')
          s=bot.read_text()
          marker=" const gestorRef=useRef(criarGestorStake({stakeBase:IA_RISK_STAKE,payout:IA_PAYOUT,maxNiveisMartingale:maxMartingale}));"
          if 'const lastPayoutRatioRef=useRef(IA_PAYOUT);' not in s:
              if marker not in s: raise SystemExit('gestorRef não encontrado')
              s=s.replace(marker,marker+'\n const lastPayoutRatioRef=useRef(IA_PAYOUT);',1)
          if 'lastPayoutRatioRef.current=ratio' not in s:
              deriv=" const{tick,balance,proposal,buy,buying,activeContractId,getProposal,subscribeTicks,isAuthorized,isConnected,error,profitTransactions,soros,setSorosStake,setSorosEnabled,contractClosedSeq,fetchProfitTable,resetTradingSession}=useDeriv(account);"
              if deriv not in s: raise SystemExit('useDeriv não encontrado')
              effect=""" useEffect(()=>{
          if(!proposal||!proposal.ask_price)return;
          const ratio=(proposal.payout-proposal.ask_price)/proposal.ask_price;
          if(Number.isFinite(ratio)&&ratio>0)lastPayoutRatioRef.current=ratio
         },[proposal]);"""
              s=s.replace(deriv,deriv+effect,1)
          updater='  gestorRef.current.atualizarPayout(lastPayoutRatioRef.current);\n'
          registrar='  gestorRef.current.registrarResultado(Number(latest.profit_loss||0));'
          if updater not in s:
              if registrar not in s: raise SystemExit('registrarResultado não encontrado')
              s=s.replace(registrar,updater+registrar,1)
          bot.write_text(s)
      - name: Build
        run: npm install && npm run build
      - name: Commit final
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/gestorStakeSorosMartingaleDinamico.ts components/AutoBotV4.tsx
          git rm .github/workflows/apply-hyper-recovery-v3.yml
          git add lib/gestorStakeSorosMartingaleDinamico.ts components/AutoBotV4.tsx
          git commit -m 'Corrige martingale: usa payout real do contrato em vez de 0.95 fixo'
          git push
