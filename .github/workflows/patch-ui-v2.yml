name: Patch AutoBotV4 UI v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AutoBotV4 safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/AutoBotV4.tsx')
          s = p.read_text()
          state_old = "const [iaPower,setIaPower]=useState(true),[sonic,setSonic]=useState(false);"
          if 'lastDigitSeen' not in s:
              if state_old not in s: raise SystemExit('state marker not found')
              s = s.replace(state_old, state_old + "\n const [lastDigitSeen,setLastDigitSeen]=useState<number|null>(null),[contractStage,setContractStage]=useState<0|1|2>(0);", 1)
          tick_old = "const pipSize=Number((tick as any).pip_size)>0?Number((tick as any).pip_size):tickPipSize;setTicks(prev=>{"
          if 'setLastDigitSeen(digit(q,pipSize))' not in s:
              if tick_old not in s: raise SystemExit('tick marker not found')
              s = s.replace(tick_old, "const pipSize=Number((tick as any).pip_size)>0?Number((tick as any).pip_size):tickPipSize;setLastDigitSeen(digit(q,pipSize));setTicks(prev=>{", 1)
          notice = "useEffect(()=>{if(!notice)return;const timer=setTimeout(()=>setNotice(null),4000);return()=>clearTimeout(timer)},[notice]);"
          if 'setContractStage(2)' not in s:
              if notice not in s: raise SystemExit('notice marker not found')
              stage = "useEffect(()=>{if(activeContractId!==null)setContractStage(1);else if(contractClosedSeq===0)setContractStage(0)},[activeContractId,contractClosedSeq]);\n useEffect(()=>{if(contractClosedSeq>0){setContractStage(2);const timer=setTimeout(()=>setContractStage(activeContractId!==null?1:0),3000);return()=>clearTimeout(timer)}},[contractClosedSeq,activeContractId]);\n "
              s = s.replace(notice, stage + notice, 1)
          start = '''<div className="card mt-3 p-4"><div className="flex items-center justify-between"><b className="text-[10px] uppercase">{t('status')}</b>'''
          end = '''<div className="card mt-3 p-4" style={{borderColor:'#facc15'}}><div className="flex justify-between"><b className="text-[10px] uppercase muted">{t('recentHistory')}</b>'''
          if start in s and end in s:
              si = s.index(start)
              ei = s.index(end, si)
              newcard = '''<div className="card mt-3 p-4">
  <div className="flex items-center justify-between">
    <b className="text-[13px] font-bold">Últimos Dígitos: {lastDigitSeen ?? '—'}</b>
    <select className="rounded-lg bg-transparent px-2 py-1 text-xs font-bold" value={tickWindow} onChange={e=>setTickWindow(Number(e.target.value))} disabled={running}>{[5,10,25,50,100,200].map(n=><option key={n} value={n}>{n} ticks</option>)}</select>
  </div>
  <div className="mt-4 grid grid-cols-10 items-end gap-1">
    {st.probs.map((p,i)=>{
      const maxP=Math.max(...st.probs),minP=Math.min(...st.probs);
      const isMax=p===maxP&&p>0,isMin=p===minP;
      const barColor=isMax?'bg-emerald-500':isMin?'bg-red-500':'bg-slate-300';
      return <div key={i} className="text-center">
        <div className={`text-[10px] font-bold ${isMax?'text-emerald-500':''}`}>{p.toFixed(0)}%</div>
        <div className={`mx-auto rounded-sm mt-1 ${barColor}`} style={{height:`${Math.max(7,Math.min(64,p*1.8))}px`,width:'20px'}}/>
        <div className="text-[10px] font-bold mt-1">{i}</div>
      </div>;
    })}
  </div>
</div>
<div className="card mt-3 p-3 flex items-center gap-3">
  <button className="flex-shrink-0 h-11 w-11 rounded-lg bg-red-600 flex items-center justify-center" onClick={stop} disabled={!running} aria-label="Parar robô">
    <span className="block h-3.5 w-3.5 bg-white rounded-sm" />
  </button>
  <div className="flex-1">
    <div className="flex items-center">
      {['Analisando','Aberto','Fechado'].map((label,i)=><div key={label} className="flex items-center" style={{flex:i<2?1:'0 0 auto'}}>
        <div className="h-[9px] w-[9px] rounded-full" style={{background:i<=contractStage?'#5b6cf5':'#1b1d1d',border:i<=contractStage?'none':'2px solid #323738'}}/>
        {i<2&&<div className="flex-1 h-[2px] mx-1" style={{background:i<contractStage?'#5b6cf5':'#323738'}}/>}
      </div>)}
    </div>
    <div className="flex justify-between mt-1.5" style={{whiteSpace:'nowrap'}}>
      {['Analisando','Aberto','Fechado'].map((label,i)=><span key={label} className="text-[10px] font-bold uppercase" style={{color:i<=contractStage?'#fff':'#6e6e6e'}}>{label}</span>)}
    </div>
  </div>
</div>
<div className="mt-2 flex items-center justify-between px-1">
  <div className="flex items-center gap-1.5 text-xs font-semibold" style={{color:'#c2c2c2'}}>
    <span className="h-1.5 w-1.5 rounded-full" style={{background:running?'#4bb4b3':'#6e6e6e'}}/>
    {running?t('running'):t('stopped')}
  </div>
  <span className="font-mono text-sm">{tick?.quote??'—'}</span>
</div>
'''
              s = s[:si] + newcard + s[ei:]
          else:
              raise SystemExit('status/history boundaries not found')
          p.write_text(s)
          PY
      - name: Build and commit
        run: |
          npm install
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AutoBotV4.tsx
          git commit -m 'Update AutoBotV4 digit status and contract stage UI'
          git rm .github/workflows/patch-ui-update.yml .github/workflows/patch-ui-v2.yml
          git commit -m 'Remove temporary AutoBotV4 patch workflows'
          git push
